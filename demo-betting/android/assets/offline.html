<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a1622; color: #e7eff7; font: 16px/1.45 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .mark { display: inline-block; background: #f7c548; color: #10223a; font: 800 22px/1 system-ui, sans-serif; padding: 8px 12px; border-radius: 6px; transform: skewX(-8deg); letter-spacing: .03em; }
  h1 { font-size: 22px; margin: 22px 0 8px; }
  p { color: #8ea7be; margin: 0 0 22px; }
  a { display: inline-block; background: #6fc23e; color: #0b1c03; font-weight: 700; text-decoration: none; padding: 12px 26px; border-radius: 6px; }
</style>
</head>
<body>
  <div>
    <span class="mark">DEMO BETTING</span>
    <h1>No connection</h1>
    <p>Check your internet and try again.<br>Hubi internetkaaga, kadibna isku day mar kale.</p>
    <a href="app://retry">Try again</a>
  </div>
</body>
</html>
