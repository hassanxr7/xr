org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Rebranding switches (see android/README.md "Rebranding" section).
# Change these two values and the launcher icon under
# app/src/main/res/mipmap-anydpi-v26/ to ship this under a different name.
# Nothing else in the source tree hardcodes "SMSBridge" or the package id.
# ---------------------------------------------------------------------------
SMSBRIDGE_APP_NAME=SMSBridge
SMSBRIDGE_APPLICATION_ID=com.smsbridge.app
